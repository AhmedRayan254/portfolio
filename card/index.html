<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ahmed Rayan Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#E4E8E6;
  --card:#111816; --ink:#EEF3F0; --muted:#98A6A0; --line:#243029; --chip:#18211E;
  --accent:#5FD1B2; --accent-ink:#06231C; --accent-soft:#16302A;
  --shadow:0 2px 4px rgba(10,14,13,.12),0 30px 60px -24px rgba(10,14,13,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ground:#070A09; --line:#26332E; --shadow:0 0 0 1px #1D2723,0 30px 60px -24px rgba(0,0,0,.8); }
}
:root[data-theme="dark"]{ --ground:#070A09; --line:#26332E; --shadow:0 0 0 1px #1D2723,0 30px 60px -24px rgba(0,0,0,.8); }
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;padding:32px 16px 48px;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.card{width:100%;max-width:400px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.hero{position:relative;aspect-ratio:640/660;max-width:100%;background:#0F1513;overflow:hidden;isolation:isolate}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;z-index:-2;animation:settle 1.2s cubic-bezier(.2,.7,.2,1) both}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,14,13,0) 38%,rgba(10,14,13,.55) 62%,rgba(17,24,22,1) 100%)}
.hero-initials{position:absolute;inset:0;display:grid;place-items:center;font-family:"Sora",sans-serif;font-weight:600;font-size:72px;color:#2A3A34;z-index:-1}
.hero-text{position:absolute;left:0;right:0;bottom:0;padding:0 24px 22px;color:#F4F7F5}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,247,245,.78);padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dot{width:6px;height:6px;border-radius:50%;background:#5FD1B2;box-shadow:0 0 0 3px rgba(95,209,178,.2)}
h1{font-family:"Sora",system-ui,sans-serif;font-weight:600;font-size:30px;line-height:1.1;margin:12px 0 0;letter-spacing:-.02em;color:#FFFFFF;text-wrap:balance}
.roles{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:3px;font-size:14.5px;color:rgba(244,247,245,.72)}
.roles b{color:#FFFFFF;font-weight:600}
.roles .nw{white-space:nowrap}
.roles .at{color:#5FD1B2;font-weight:600;padding:0 2px}
@keyframes settle{from{transform:scale(1.06)}to{transform:scale(1)}}
.body{padding:20px 24px 24px;display:grid;gap:20px}
.bio{margin:0;color:var(--muted);font-size:14.5px}
.primary{display:grid;grid-template-columns:1fr auto;gap:10px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;min-height:48px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .15s ease,background .15s ease}
button:active{transform:scale(.98)}
.save{background:var(--accent);color:var(--accent-ink)}
.ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.folio{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--accent-soft);color:var(--ink);text-decoration:none;border:1px solid transparent;transition:border-color .15s ease}
.folio:hover{border-color:var(--accent)}
.folio-ico{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.folio-ico svg{width:20px;height:20px}
.folio-k{display:block;font-family:"Sora",system-ui,sans-serif;font-weight:600;font-size:15px}
.folio-v{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.folio-arrow{color:var(--accent);font-size:20px;font-weight:600}
.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px}
.list li+li{border-top:1px solid var(--line)}
.list a{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;padding:12px 12px 12px 14px;color:var(--ink);text-decoration:none;min-width:0}
.list a:hover{background:var(--chip)}
.ico{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.ico svg{width:18px;height:18px}
.k{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}
.v{display:block;font-weight:500;font-size:14px;overflow-wrap:anywhere}
.chev{color:var(--muted)}
.social{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.social a{display:grid;justify-items:center;gap:6px;padding:12px 4px;border-radius:12px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:12px;font-weight:500;border:1px solid transparent}
.social a:hover{border-color:var(--line)}
.social svg{width:20px;height:20px;color:var(--accent)}
.qr{display:grid;justify-items:center;gap:14px;padding:24px 16px;border-radius:16px;background:var(--chip);text-align:center}
#qrbox{background:#fff;padding:14px;border-radius:14px;width:min(248px,100%);aspect-ratio:1;max-width:100%}
#qrbox svg{width:100%;height:100%;display:block}
.qr strong{display:block;color:var(--ink);font-family:"Sora",system-ui,sans-serif;font-weight:600;font-size:16px}
.qr p{margin:2px 0 0;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.foot{text-align:center;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 24px 20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){h1{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

<main class="card" aria-label="Digital business card">
  <header class="hero" id="hero">
    <img class="hero-img" id="heroImg" alt="" hidden>
    <div class="hero-initials" id="initials" aria-hidden="true"></div>
    <div class="hero-text">
      <span class="eyebrow"><span class="dot"></span><span id="location"></span></span>
      <h1 id="name"></h1>
      <ul class="roles" id="roles"></ul>
    </div>
  </header>

  <section class="body">
    <p class="bio" id="bio"></p>

    <div class="primary">
      <button class="save" id="saveBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        Save contact

      <button class="ghost" id="shareBtn" type="button" aria-label="Share card">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
        Share
      </button>
    </div>

    <a class="folio" id="folioBtn" href="#" target="_blank" rel="noopener">
      <span class="folio-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg></span>
      <span><span class="folio-k">View my portfolio</span><span class="folio-v" id="folioUrl"></span></span>
      <span class="folio-arrow" aria-hidden="true">↗</span>

$('qrurl').textContent = (CARD.cardUrl || location.href).replace(/^https?:\/\//,'');

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}

const inPreview = !!(window.claude && window.claude.use);
$('saveBtn').addEventListener('click', () => {
  if (inPreview){ toast('Preview mode: this button works once the card is live on your site.'); return; }
  const blob = new Blob([vcard()], {type:'text/vcard'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${CARD.firstName}-${CARD.lastName}.vcf`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Contact file downloaded — open it to add to your phone');
});

$('shareBtn').addEventListener('click', async () => {
  const url = CARD.cardUrl || location.href;
  const data = {title: full, text: `${full} — ${CARD.roles.map(r=>r.title+' @ '+r.company).join(', ')}`, url};
  try {
    if (navigator.share){ await navigator.share(data); return; }
    await navigator.clipboard.writeText(url); toast('Link copied');
  } catch(e){ if (e && e.name !== 'AbortError') toast('Copy this link: ' + url); }
});
</script>
</body></html>
